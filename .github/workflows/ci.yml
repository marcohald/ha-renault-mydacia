name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Validate JSON & Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import glob, json, sys
          files = glob.glob("custom_components/**/*.json", recursive=True) + ["hacs.json"]
          for f in files:
              json.load(open(f, encoding="utf-8"))
              print("ok", f)
          PY

      - name: No unresolved [%key:...%] references in translations
        # HA only resolves these references for core integrations; custom
        # integrations must ship fully resolved translations/*.json.
        run: |
          if grep -n '\[%key:' custom_components/renault/translations/*.json; then
            echo "::error::Unresolved [%key:...%] references in translations"
            exit 1
          fi

      - name: Compile Python sources
        run: python -m compileall -q custom_components tests

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run pytest
        run: python -m pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: pytest-report.xml
